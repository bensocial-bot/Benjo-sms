<!-- =========================================================
     BENJO-SMS ADMIN DASHBOARD
========================================================= -->

<style>
  #adminPanel {
    display: none;
    max-width: 1100px;
    margin: 40px auto;
    padding: 25px;
    background: #131318;
    border: 1px solid #292933;
    border-radius: 16px;
  }

  #adminPanel h2 {
    margin-bottom: 20px;
  }

  .admin-form {
    display: grid;
    gap: 12px;
    margin-bottom: 30px;
  }

  .admin-input {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: 1px solid #33333d;
    background: #0d0d12;
    color: white;
    outline: none;
  }

  .admin-button {
    padding: 12px 18px;
    border: none;
    border-radius: 8px;
    background: #7c5cff;
    color: white;
    cursor: pointer;
    font-weight: bold;
  }

  .admin-button.delete {
    background: #b83250;
  }

  .admin-services {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 15px;
  }

  .admin-service {
    border: 1px solid #292933;
    border-radius: 12px;
    padding: 18px;
    background: #101015;
  }

  .admin-service h3 {
    margin-bottom: 8px;
  }

  .admin-service p {
    color: #999;
    margin-bottom: 10px;
  }

  .admin-actions {
    display: flex;
    gap: 8px;
    margin-top: 15px;
  }

  .admin-message {
    margin-bottom: 15px;
    color: #aaa;
  }
</style>

<section id="adminPanel">

  <h2>👑 Benjo-SMS Admin Dashboard</h2>

  <p class="admin-message" id="adminMessage"></p>

  <h3>Add Service</h3>

  <form class="admin-form" id="addServiceForm">

    <input
      class="admin-input"
      id="serviceName"
      type="text"
      placeholder="Service name"
      required
    >

    <textarea
      class="admin-input"
      id="serviceDescription"
      placeholder="Service description"
      rows="4"
    ></textarea>

    <input
      class="admin-input"
      id="servicePrice"
      type="number"
      min="0"
      step="0.01"
      placeholder="Price in ₦"
      required
    >

    <button
      class="admin-button"
      type="submit"
    >
      ➕ Add Service
    </button>

  </form>

  <h3>Services</h3>

  <br>

  <div
    class="admin-services"
    id="adminServices"
  ></div>

</section>


<script>
/* =========================================================
   ADMIN DASHBOARD
========================================================= */

async function checkAdminAccess() {

  const {
    data: {
      user
    }
  } = await supabaseClient.auth.getUser();

  if (!user) {
    document.getElementById("adminPanel").style.display = "none";
    return;
  }

  const {
    data,
    error
  } = await supabaseClient
    .from("Benjosms")
    .select("is_admin")
    .eq("id", user.id)
    .maybeSingle();

  if (error) {
    console.error("Admin check error:", error);
    return;
  }

  if (data && data.is_admin === true) {

    document.getElementById("adminPanel").style.display = "block";

    loadAdminServices();

  } else {

    document.getElementById("adminPanel").style.display = "none";

  }
}


/* =========================================================
   LOAD SERVICES
========================================================= */

async function loadAdminServices() {

  const container =
    document.getElementById("adminServices");

  container.innerHTML =
    "<p>Loading services...</p>";

  const {
    data,
    error
  } = await supabaseClient
    .from("services")
    .select("*")
    .order("created_at", {
      ascending: false
    });

  if (error) {

    container.innerHTML =
      "<p>Could not load services.</p>";

    console.error(error);

    return;

  }

  if (!data || data.length === 0) {

    container.innerHTML =
      "<p>No services yet.</p>";

    return;

  }

  container.innerHTML = "";

  data.forEach(service => {

    const card =
      document.createElement("div");

    card.className =
      "admin-service";

    card.innerHTML = `

      <h3>${escapeHTML(service.name)}</h3>

      <p>
        ${escapeHTML(service.description || "")}
      </p>

      <strong>
        ₦${Number(service.price).toLocaleString()}
      </strong>

      <p>
        Status:
        ${service.available ? "Available" : "Hidden"}
      </p>

      <div class="admin-actions">

        <button
          class="admin-button"
          onclick="editService('${service.id}')"
        >
          ✏️ Edit
        </button>

        <button
          class="admin-button delete"
          onclick="deleteService('${service.id}')"
        >
          🗑️ Delete
        </button>

      </div>

    `;

    container.appendChild(card);

  });

}


/* =========================================================
   ADD SERVICE
========================================================= */

document
  .getElementById("addServiceForm")
  .addEventListener("submit", async function(event) {

    event.preventDefault();

    const name =
      document
        .getElementById("serviceName")
        .value
        .trim();

    const description =
      document
        .getElementById("serviceDescription")
        .value
        .trim();

    const price =
      Number(
        document
          .getElementById("servicePrice")
          .value
      );

    const message =
      document.getElementById("adminMessage");

    if (!name || !Number.isFinite(price)) {

      message.textContent =
        "Enter a valid service name and price.";

      return;

    }

    const {
      error
    } = await supabaseClient
      .from("services")
      .insert({

        name: name,

        description: description,

        price: price,

        available: true

      });

    if (error) {

      console.error(error);

      message.textContent =
        "Could not add service: " +
        error.message;

      return;

    }

    message.textContent =
      "Service added successfully.";

    document
      .getElementById("addServiceForm")
      .reset();

    loadAdminServices();

  });


/* =========================================================
   EDIT SERVICE
========================================================= */

async function editService(id) {

  const {
    data: service,
    error: fetchError
  } = await supabaseClient
    .from("services")
    .select("*")
    .eq("id", id)
    .single();

  if (fetchError) {

    alert(fetchError.message);

    return;

  }

  const newName =
    prompt(
      "Service name:",
      service.name
    );

  if (newName === null) return;

  const newDescription =
    prompt(
      "Description:",
      service.description || ""
    );

  if (newDescription === null) return;

  const newPrice =
    prompt(
      "Price:",
      service.price
    );

  if (newPrice === null) return;

  const price =
    Number(newPrice);

  if (!Number.isFinite(price) || price < 0) {

    alert("Invalid price.");

    return;

  }

  const {
    error
  } = await supabaseClient
    .from("services")
    .update({

      name: newName.trim(),

      description: newDescription.trim(),

      price: price

    })
    .eq("id", id);

  if (error) {

    alert(error.message);

    return;

  }

  alert("Service updated.");

  loadAdminServices();

}


/* =========================================================
   DELETE SERVICE
========================================================= */

async function deleteService(id) {

  const confirmed =
    confirm(
      "Delete this service?"
    );

  if (!confirmed) return;

  const {
    error
  } = await supabaseClient
    .from("services")
    .delete()
    .eq("id", id);

  if (error) {

    alert(error.message);

    return;

  }

  alert("Service deleted.");

  loadAdminServices();

}


/* =========================================================
   SECURITY / HTML ESCAPING
========================================================= */

function escapeHTML(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   START ADMIN CHECK
========================================================= */

checkAdminAccess();
</script>
