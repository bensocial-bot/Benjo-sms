<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Benjo-SMS | Digital Marketplace</title>

<!-- Supabase config: Replace the values below in GitHub Pages or in the deployed index.html with your project's values -->
<meta name="supabase-url" content="%SUPABASE_URL_HERE%">
<meta name="supabase-anon-key" content="%SUPABASE_ANON_KEY_HERE%">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* (existing CSS kept unchanged) */
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
html{scroll-behavior:smooth}
body{background:radial-gradient(circle at 20% 10%,rgba(124,92,255,.18),transparent 30%),radial-gradient(circle at 80% 20%,rgba(0,180,255,.1),transparent 28%),#08080d;color:#fff;min-height:100vh}
button,input,select,textarea{font:inherit}
header{background:rgba(12,12,18,.96);backdrop-filter:blur(12px);border-bottom:1px solid #262631;padding:15px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.logo{font-size:24px;font-weight:800}
.logo span,.link{color:#8b70ff}
nav{display:flex;align-items:center;gap:12px}
nav a,nav button{color:#ccc;text-decoration:none;background:none;border:none;cursor:pointer;font-size:14px}
.login-btn{background:#7c5cff!important;color:#fff!important;padding:10px 16px;border-radius:8px}
.logout-nav{color:#ff6f91!important}
.hero{padding:80px 5% 55px;text-align:center;background:linear-gradient(rgba(8,8,13,.45),rgba(8,8,13,.9)),radial-gradient(circle at 50% 0%,#32246b 0%,#10101a 42%,#08080d 75%);border-bottom:1px solid #1d1d27}
.hero-badge{display:inline-block;padding:7px 13px;border:1px solid #3b335e;background:rgba(124,92,255,.1);color:#b8aaff;border-radius:30px;font-size:13px;margin-bottom:20px}
.hero h1{font-size:clamp(38px,7vw,70px);margin-bottom:20px;line-height:1.05}
.hero h1 span{color:#8b70ff}
.hero p{color:#aaa;max-width:680px;margin:auto;line-height:1.7;font-size:17px}
.hero-buttons{margin-top:30px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.primary-btn,.secondary-btn{padding:13px 22px;border-radius:9px;text-decoration:none;font-weight:bold;cursor:pointer}
.primary-btn{background:#7c5cff;color:#fff;border:none}
.secondary-btn{background:transparent;border:1px solid #383842;color:#fff}
.section{padding:55px 5%;max-width:1200px;margin:auto}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;gap:15px;flex-wrap:wrap}
.section-title h2{font-size:28px}
.section-title p{color:#888;font-size:14px;margin-top:6px}
.search{background:#15151d;border:1px solid #2b2b36;color:#fff;padding:12px 15px;border-radius:8px;width:240px;outline:none}
.products,.service-grid,.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card,.service-card,.feature{background:rgba(19,19,26,.95);border:1px solid #282832;border-radius:14px;padding:20px}
.card:hover,.service-card:hover{transform:translateY(-3px);border-color:#7c5cff}
.card-icon{width:50px;height:50px;border-radius:12px;background:#211b40;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:18px}
.card h3{margin-bottom:8px}
.card p,.service-card p,.feature p{color:#999;font-size:14px;line-height:1.5;margin-bottom:14px}
.price{font-size:20px;font-weight:bold;margin-bottom:15px}
.buy-btn,.auth-btn,.wallet-btn{width:100%;border:none;background:#7c5cff;color:#fff;padding:12px;border-radius:8px;cursor:pointer;font-weight:bold}
.buy-btn:disabled{opacity:.5;cursor:not-allowed}
.service-card{cursor:pointer;transition:.2s}
.service-card h3{margin:10px 0}
.service-icon{font-size:30px}
.wallet-box{background:linear-gradient(135deg,rgba(124,92,255,.25),rgba(26,26,40,.95));border:1px solid #40356c;border-radius:16px;padding:25px;margin-bottom:25px}
.wallet-label{color:#aaa;font-size:14px;margin-bottom:8px}
.wallet-balance{font-size:32px;font-weight:800;margin-bottom:18px}
.wallet-actions{display:flex;gap:10px;flex-wrap:wrap}
.wallet-btn{width:auto;padding:11px 18px}
.wallet-btn.secondary,.small-btn{background:#252531}
.account-box{display:none;max-width:900px;margin:30px auto 0;background:rgba(19,19,26,.96);border:1px solid #292934;border-radius:14px;padding:22px;text-align:left}
.account-box h2{margin-bottom:15px}
.account-box p{color:#aaa;margin:8px 0}
.account-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.small-btn{padding:10px 14px;border:none;border-radius:8px;cursor:pointer;color:#fff}
.whatsapp-btn{background:#19a463}
footer{border-top:1px solid #25252d;background:#0d0d12;padding:30px 5%;text-align:center;color:#777;margin-top:40px}
.cart{position:fixed;right:20px;bottom:20px;background:#7c5cff;width:55px;height:55px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;box-shadow:0 8px 25px rgba(0,0,0,.4);z-index:50}
#cartCount{position:absolute;top:-5px;right:-5px;background:#ff3b6b;width:21px;height:21px;border-radius:50%;font-size:12px;display:flex;align-items:center;justify-content:center}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:999;align-items:center;justify-content:center;padding:20px}
.modal-box{width:100%;max-width:500px;max-height:90vh;overflow-y:auto;background:#15151c;border:1px solid #30303b;border-radius:16px;padding:25px;position:relative}
.modal-box h2{margin-bottom:20px}
.close{position:absolute;right:18px;top:15px;background:none;border:none;color:#aaa;font-size:25px;cursor:pointer}
.input{width:100%;padding:13px;margin-bottom:12px;background:#0d0d12;color:#fff;border:1px solid #30303a;border-radius:8px;outline:none}
.input:focus{border-color:#7c5cff}
.forgot{text-align:right;margin:3px 0 10px}
.forgot span,.switch span:last-child{color:#9a82ff;cursor:pointer}
.switch{text-align:center;margin-top:15px;color:#999;font-size:14px}
.message{margin-bottom:12px;font-size:14px;line-height:1.5;color:#ddd}
.success{color:#5ee39b}
.error{color:#ff7895}
.notice{background:#191923;border:1px solid #30303b;border-radius:10px;padding:12px;color:#aaa;font-size:13px;line-height:1.5;margin-bottom:15px}
.payment-card{background:#0d0d12;border:1px solid #343442;border-radius:12px;padding:15px;margin:10px 0;cursor:pointer;transition:.2s}
.payment-card:hover{border-color:#7c5cff}
.payment-card.active{border-color:#7c5cff;background:#211b40}
.payment-card b{display:block;margin-bottom:6px}
.payment-card small{display:block;color:#999;margin-top:5px;white-space:pre-line;line-height:1.5}
.delivery-box{background:#0d0d12;border:1px solid #343442;border-radius:12px;padding:18px;margin-top:15px}
.delivery-box p{color:#bbb;margin:8px 0;word-break:break-word}
.delivery-box strong{color:#fff}
.empty{color:#999;padding:20px;text-align:center;border:1px dashed #333;border-radius:12px}
@media(max-width:650px){nav a:not(.login-btn){display:none}.hero{padding:60px 5%}.search{width:100%}}
</style>
</head>

<body>

<header>
  <div class="logo">Benjo<span>-SMS</span></div>

  <nav>
    <a href="#home">Home</a>
    <a href="#accounts">Accounts</a>
    <a href="#services">Services</a>
    <a href="#boosting">Boosting</a>

    <a href="#wallet" id="walletNav" style="display:none">Wallet</a>

    <a
      href="#"
      id="accountNav"
      style="display:none"
      onclick="scrollToAccount();return false"
    >
      Account
    </a>

    <a
      href="#"
      class="login-btn"
      id="loginNav"
      onclick="openAuth('login');return false"
    >
      Login
    </a>

    <button
      id="logoutNav"
      class="logout-nav"
      style="display:none"
      onclick="logout()"
    >
      Logout
    </button>
  </nav>
</header>

<!-- (rest of the original HTML unchanged - truncated for brevity in this commit) -->

<!-- Scripted frontend app -->
<script src="js/app.js"></script>
</body>
</html>
